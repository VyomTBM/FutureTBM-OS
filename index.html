<!DOCTYPE html>

  <style>
    /* Scanline & Hologram Overlay */
    body::before {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 38, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                  linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
      z-index: 100;
      background-size: 100% 3px, 6px 100%;

    .glass-panel {
      background: rgba(13, 18, 38, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 243, 255, 0.25);
    }

    /* Dedicated Cyber Markdown Renderer Styling */
    .md-render h1 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #00f3ff;
      border-bottom: 1px solid rgba(0, 243, 255, 0.3);
      padding-bottom: 0.35rem;

    }
    .md-render h2 {
      font-size: 1.2rem;

      margin-bottom: 0.5rem;
    }
    .md-render h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: #b388ff;
      margin-top: 0.75rem;
      margin-bottom: 0.25rem;
    }
    .md-render p {
      color: #cbd5e1;
      margin-bottom: 0.75rem;
      line-height: 1.55;
    }
    .md-render ul {
      list-style-type: square;
      padding-left: 1.25rem;
      margin-bottom: 0.75rem;
      color: #00f3ff;
    }
    .md-render ul li {
      color: #cbd5e1;
      margin-bottom: 0.25rem;
    }
    .md-render ol {
      list-style-type: decimal;
      padding-left: 1.25rem;
      margin-bottom: 0.75rem;
      color: #cbd5e1;
    }
    .md-render blockquote {
      border-left: 3px solid #00f3ff;
      background: rgba(0, 243, 255, 0.06);
      padding: 0.5rem 0.75rem;
      margin-bottom: 0.75rem;
      font-style: italic;

    }
    .md-render code {
      background: rgba(255, 0, 127, 0.15);
      border: 1px solid rgba(255, 0, 127, 0.3);
      color: #ff77b4;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      font-family: monospace;
      font-size: 0.88em;
    }
    .md-render pre {
      background: rgba(6, 8, 20, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.3);
      border-radius: 6px;
      padding: 0.75rem;
      overflow-x: auto;
      margin-bottom: 0.75rem;
    }
    .md-render pre code {
      background: transparent;
      border: none;
      color: #34d399;
      padding: 0;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;

      background: rgba(10, 12, 28, 0.8);
    }
    ::-webkit-scrollbar-thumb {
      background: #00f3ff;
      border-radius: 3px;
    }
  </style>
</head>

<body class="bg-cyberDark text-slate-100 h-screen w-screen overflow-hidden select-none font-sans relative">

  <!-- Desktop Surface -->
  <main id="desktop" class="w-full h-[calc(100vh-3.2rem)] relative overflow-hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-[#111638] via-[#090b16] to-[#04050a]">
    
    <!-- Cyber Grid Background Decoration -->
    <div class="absolute inset-0 opacity-20 pointer-events-none bg-[linear-gradient(to_right,#00f3ff12_1px,transparent_1px),linear-gradient(to_bottom,#00f3ff12_1px,transparent_1px)] bg-[size:40px_40px]"></div>

    <!-- Desktop Icons Grid -->
    <div class="p-6 grid grid-flow-row gap-6 auto-rows-max w-28 z-10 relative">
      <button onclick="launchApp('files')" class="group flex flex-col items-center gap-2 p-2 rounded-lg hover:bg-white/5 transition-all text-center focus:outline-none">

        <div class="w-12 h-12 rounded-xl bg-pink-950/60 border border-neonPink/40 flex items-center justify-center text-neonPink group-hover:scale-105 group-hover:shadow-neonPink transition-all">📝</div>
        <span class="text-xs tracking-wider text-slate-300 font-medium group-hover:text-neonPink drop-shadow">MD Studio</span>
      </button>

      <button onclick="launchApp('dos')" class="group flex flex-col items-center gap-2 p-2 rounded-lg hover:bg-white/5 transition-all text-center focus:outline-none">
        <div class="w-12 h-12 rounded-xl bg-emerald-950/60 border border-emerald-400/40 flex items-center justify-center text-emerald-400 group-hover:scale-105 group-hover:shadow-[0_0_15px_rgba(52,211,153,0.3)] transition-all">📟</div>

        <div class="w-12 h-12 rounded-xl bg-amber-950/60 border border-amber-400/40 flex items-center justify-center text-amber-300 group-hover:scale-105 group-hover:shadow-[0_0_15px_rgba(251,191,36,0.3)] transition-all">📌</div>
        <span class="text-xs tracking-wider text-slate-300 font-medium group-hover:text-amber-300 drop-shadow">Notes</span>
      </button>

      <button onclick="launchApp('sysinfo')" class="group flex flex-col items-center gap-2 p-2 rounded-lg hover:bg-white/5 transition-all text-center focus:outline-none">
        <div class="w-12 h-12 rounded-xl bg-purple-950/60 border border-neonPurple/40 flex items-center justify-center text-neonPurple group-hover:scale-105 group-hover:shadow-[0_0_15px_rgba(157,78,221,0.3)] transition-all">⚙️</div>
        <span class="text-xs tracking-wider text-slate-300 font-medium group-hover:text-neonPurple drop-shadow">System</span>
      </button>
    </div>

    <!-- Active Windows Layer -->
    <div id="windows-container" class="absolute inset-0 pointer-events-none"></div>

    <!-- In-OS Futuristic Holographic Modal Layer -->
    <div id="os-modal-layer" class="hidden absolute inset-0 bg-black/60 backdrop-blur-sm z-[999] flex items-center justify-center pointer-events-auto">
      <div id="os-modal-box" class="glass-panel w-full max-w-md rounded-xl p-5 border border-neonCyan shadow-neon transform transition-all duration-200 scale-95 opacity-0">
        <div class="flex items-center justify-between pb-3 mb-3 border-b border-white/10 font-mono text-xs">
          <span id="os-modal-title" class="text-neonCyan font-bold tracking-wider uppercase">[SYSTEM NOTICE]</span>
          <button onclick="OS.closeModal()" class="text-slate-400 hover:text-white">✕</button>
        </div>

        <div id="os-modal-input-wrap" class="hidden mb-4">

        </div>
        <div class="flex justify-end gap-2 font-mono text-xs">
          <button id="os-modal-btn-cancel" onclick="OS.closeModal()" class="px-4 py-1.5 rounded bg-white/5 border border-white/20 text-slate-300 hover:bg-white/10 transition">CANCEL</button>
          <button id="os-modal-btn-confirm" class="px-4 py-1.5 rounded bg-cyan-500/20 border border-neonCyan text-neonCyan hover:bg-neonCyan hover:text-black font-bold transition shadow-neon">CONFIRM</button>
        </div>
      </div>
    </div>
  </main>

  <!-- Futuristic Taskbar -->
  <footer class="h-[3.2rem] w-full glass-panel border-t border-neonCyan/30 px-4 flex items-center justify-between z-50">
    <div class="flex items-center gap-3">
      <button onclick="toggleLauncher()" class="flex items-center gap-2 px-3 py-1.5 rounded bg-cyan-950/80 border border-neonCyan text-neonCyan font-bold tracking-widest text-xs hover:bg-neonCyan hover:text-black transition-all shadow-neon">
        <span>▲</span>
        <span>FUTURE·OS</span>
      </button>
      <div class="h-5 w-px bg-slate-700"></div>
      <div id="taskbar-apps" class="flex items-center gap-2"></div>
    </div>

    <!-- Right: 12-Hour Clock & Telemetry -->
    <div class="flex items-center gap-4 text-xs font-mono">
      <div class="hidden sm:flex items-center gap-2 text-slate-400 bg-white/5 px-2 py-1 rounded border border-white/10">
        <span class="inline-block w-2 h-2 rounded-full bg-neonCyan animate-pulse"></span>
        <span id="mem-stat">MEM: OK</span>
      </div>

      <div class="flex flex-col text-right">
        <span id="clock" class="text-neonCyan font-bold tracking-wider leading-none text-sm">12:00:00 AM</span>
        <span id="stardate" class="text-[9px] text-slate-400 leading-tight">ONLINE</span>
      </div>
    </div>
  </footer>

  <!-- App Launcher Dropup Menu -->
  <div id="launcher-menu" class="hidden absolute bottom-14 left-4 w-72 glass-panel rounded-xl p-3 flex flex-col gap-2 z-50 shadow-neon">
    <div class="px-2 py-1 text-[11px] font-mono tracking-wider text-neonCyan uppercase border-b border-white/10 flex justify-between">
      <span>Systems Operational</span>
      <span>v2.6.2</span>
    </div>
    <div class="flex flex-col gap-1 text-sm">
      <button onclick="launchApp('files'); toggleLauncher();" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-neonCyan/20 text-left transition">📂 File Manager</button>
      <button onclick="launchApp('markdown'); toggleLauncher();" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-neonPink/20 text-left transition">📝 Markdown Studio</button>
      <button onclick="launchApp('dos'); toggleLauncher();" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-emerald-500/20 text-left transition">📟 DOS Shell</button>
      <button onclick="launchApp('notes'); toggleLauncher();" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-amber-500/20 text-left transition">📌 CyberNotes</button>
      <button onclick="launchApp('sysinfo'); toggleLauncher();" class="flex items-center gap-3 px-3 py-2 rounded hover:bg-purple-500/20 text-left transition">⚙️ Diagnostics</button>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. OS STATE & IN-OS MODAL DIALOG SUBSYSTEM
       ========================================================== */
    const OS = {
      zIndexCounter: 100,
      windows: {},
      files: JSON.parse(sessionStorage.getItem('tbm_files')) || {
        'cyber_manifesto.md': '# FutureTBM OS\n\n> The browser is the universal runtime.\n\n### Core Directives\n- Zero bloat vanilla execution\n- Native 12-hour chronometer\n- Pure glassmorphic UI architecture\n\n```js\nconst status = "Hypervisor Active";\nconsole.log(status);\n```\n\nFeel free to modify this text in real time!',
        'readme.txt': 'FutureTBM OS Session Active.\nAll file operations are persistent across tab interactions.',
        'diagnostic.bat': '@echo off\necho Telemetry links established.'
      },
      notes: JSON.parse(localStorage.getItem('tbm_notes')) || [
        { id: 1, text: 'Deploy orbital comm relay packet.' },
        { id: 2, text: 'Calibrate neural link buffers.' }
      ],
      saveFiles() {
        sessionStorage.setItem('tbm_files', JSON.stringify(this.files));
      },
      saveNotes() {
        localStorage.setItem('tbm_notes', JSON.stringify(this.notes));
      },

      // Holographic OS-level Alert
      alert(title, message) {
        return new Promise((resolve) => {
          const layer = document.getElementById('os-modal-layer');
          const box = document.getElementById('os-modal-box');
          const tEl = document.getElementById('os-modal-title');
          const mEl = document.getElementById('os-modal-msg');
          const inputWrap = document.getElementById('os-modal-input-wrap');
          const cancelBtn = document.getElementById('os-modal-btn-cancel');
          const confirmBtn = document.getElementById('os-modal-btn-confirm');

          tEl.innerText = title || '[SYSTEM ALERT]';
          mEl.innerText = message;
          inputWrap.classList.add('hidden');
          cancelBtn.classList.add('hidden');

          confirmBtn.onclick = () => {
            OS.closeModal();
            resolve(true);
          };

          layer.classList.remove('hidden');
          setTimeout(() => {
            box.classList.remove('scale-95', 'opacity-0');
            box.classList.add('scale-100', 'opacity-100');
            confirmBtn.focus();
          }, 10);
        });
      },

      // Holographic OS-level Prompt
      prompt(title, message, defaultValue = '') {
        return new Promise((resolve) => {
          const layer = document.getElementById('os-modal-layer');
          const box = document.getElementById('os-modal-box');
          const tEl = document.getElementById('os-modal-title');
          const mEl = document.getElementById('os-modal-msg');
          const inputWrap = document.getElementById('os-modal-input-wrap');
          const input = document.getElementById('os-modal-input');
          const cancelBtn = document.getElementById('os-modal-btn-cancel');
          const confirmBtn = document.getElementById('os-modal-btn-confirm');

          tEl.innerText = title || '[SYSTEM INPUT]';
          mEl.innerText = message;
          inputWrap.classList.remove('hidden');
          cancelBtn.classList.remove('hidden');
          input.value = defaultValue;

          function submit() {
            const val = input.value.trim();
            OS.closeModal();
            resolve(val || null);
          }

          confirmBtn.onclick = submit;
          cancelBtn.onclick = () => {
            OS.closeModal();
            resolve(null);
          };

          input.onkeydown = (e) => {
            if (e.key === 'Enter') submit();
            if (e.key === 'Escape') {
              OS.closeModal();
              resolve(null);
            }
          };

          layer.classList.remove('hidden');
          setTimeout(() => {
            box.classList.remove('scale-95', 'opacity-0');
            box.classList.add('scale-100', 'opacity-100');
            input.focus();
            input.select();
          }, 10);
        });
      },

      closeModal() {
        const layer = document.getElementById('os-modal-layer');
        const box = document.getElementById('os-modal-box');
        box.classList.add('scale-95', 'opacity-0');
        box.classList.remove('scale-100', 'opacity-100');
        setTimeout(() => layer.classList.add('hidden'), 150);
      }
    };

    /* ==========================================================
       2. WINDOW MANAGER ENGINE
       ========================================================== */
    function createWindow({ id, title, icon, content, width = 640, height = 440, x = 120, y = 70 }) {
      if (OS.windows[id]) {
        bringToFront(id);
        if (OS.windows[id].minimized) toggleMinimize(id);
        return;
      }

      const container = document.getElementById('windows-container');
      const win = document.createElement('div');
      win.id = `win-${id}`;
      win.className = 'absolute glass-panel rounded-xl overflow-hidden shadow-2xl flex flex-col pointer-events-auto';
      win.style.width = `${width}px`;
      win.style.height = `${height}px`;
      win.style.top = `${y + (Object.keys(OS.windows).length * 24)}px`;
      win.style.left = `${x + (Object.keys(OS.windows).length * 24)}px`;
      win.style.zIndex = ++OS.zIndexCounter;

      win.innerHTML = `
        <div class="h-9 px-3 bg-cyberDark/90 border-b border-neonCyan/30 flex items-center justify-between cursor-move handle">
          <div class="flex items-center gap-2 text-xs font-mono text-cyan-300 pointer-events-none">
            <span>${icon}</span>
            <span class="tracking-wider uppercase font-semibold">${title}</span>
          </div>
          <div class="flex items-center gap-1.5">
            <button onclick="toggleMinimize('${id}')" class="w-3.5 h-3.5 rounded-full bg-yellow-500/80 hover:bg-yellow-400 flex items-center justify-center text-[8px] text-black">_</button>
            <button onclick="toggleMaximize('${id}')" class="w-3.5 h-3.5 rounded-full bg-green-500/80 hover:bg-green-400 flex items-center justify-center text-[8px] text-black">□</button>
            <button onclick="closeWindow('${id}')" class="w-3.5 h-3.5 rounded-full bg-red-500/80 hover:bg-red-400 flex items-center justify-center text-[8px] text-black">✕</button>
          </div>
        </div>
        <div class="flex-1 overflow-auto p-4 bg-cyberDark/70 text-slate-200 text-sm select-text">
          ${content}
        </div>
      `;

      win.addEventListener('mousedown', () => bringToFront(id));
      container.appendChild(win);

      OS.windows[id] = { element: win, minimized: false, maximized: false, prevBounds: null };
      makeDraggable(win);
      updateTaskbar();
    }

    function bringToFront(id) {
      if (OS.windows[id]) {
        OS.windows[id].element.style.zIndex = ++OS.zIndexCounter;
        updateTaskbar();
      }
    }

    function closeWindow(id) {
      if (OS.windows[id]) {
        OS.windows[id].element.remove();
        delete OS.windows[id];
        updateTaskbar();
      }
    }

    function toggleMinimize(id) {
      const winData = OS.windows[id];
      if (!winData) return;
      winData.minimized = !winData.minimized;
      winData.element.style.display = winData.minimized ? 'none' : 'flex';
      if (!winData.minimized) bringToFront(id);
      updateTaskbar();
    }

    function toggleMaximize(id) {
      const winData = OS.windows[id];
      if (!winData) return;

      if (!winData.maximized) {
        winData.prevBounds = {
          top: winData.element.style.top,
          left: winData.element.style.left,
          width: winData.element.style.width,
          height: winData.element.style.height
        };
        winData.element.style.top = '0px';
        winData.element.style.left = '0px';
        winData.element.style.width = '100vw';
        winData.element.style.height = 'calc(100vh - 3.2rem)';
        winData.maximized = true;
      } else {
        winData.element.style.top = winData.prevBounds.top;
        winData.element.style.left = winData.prevBounds.left;
        winData.element.style.width = winData.prevBounds.width;
        winData.element.style.height = winData.prevBounds.height;
        winData.maximized = false;
      }
      bringToFront(id);
    }

    function makeDraggable(win) {
      const handle = win.querySelector('.handle');
      let isDragging = false;
      let startX, startY, initialLeft, initialTop;

      handle.addEventListener('mousedown', (e) => {
        if (e.target.tagName === 'BUTTON') return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialLeft = win.offsetLeft;
        initialTop = win.offsetTop;

        function onMouseMove(moveEvent) {
          if (!isDragging) return;
          win.style.left = `${initialLeft + (moveEvent.clientX - startX)}px`;
          win.style.top = `${initialTop + (moveEvent.clientY - startY)}px`;
        }

        function onMouseUp() {
          isDragging = false;
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }

    function updateTaskbar() {
      const taskbar = document.getElementById('taskbar-apps');
      taskbar.innerHTML = '';
      Object.keys(OS.windows).forEach(id => {
        const win = OS.windows[id];
        const btn = document.createElement('button');
        btn.className = `px-3 py-1 rounded text-xs font-mono flex items-center gap-1.5 transition border ${
          win.minimized ? 'bg-white/5 border-slate-700 text-slate-400' : 'bg-neonCyan/10 border-neonCyan/50 text-neonCyan'
        }`;
        btn.innerHTML = `<span class="w-1.5 h-1.5 rounded-full ${win.minimized ? 'bg-slate-500' : 'bg-neonCyan'}"></span> ${id.toUpperCase()}`;
        btn.onclick = () => toggleMinimize(id);
        taskbar.appendChild(btn);
      });
    }

    function toggleLauncher() {
      document.getElementById('launcher-menu').classList.toggle('hidden');
    }

    /* ==========================================================
       3. APPS ENGINE & USER INTERACTION
       ========================================================== */
    function launchApp(appId) {
      switch(appId) {
        case 'files':
          createWindow({
            id: 'files',
            title: 'File Manager',
            icon: '📂',
            width: 620,
            height: 420,
            content: renderFileManager()
          });
          initFileManagerEvents();
          break;

        case 'markdown':
          createWindow({
            id: 'markdown',
            title: 'Markdown Studio',
            icon: '📝',
            width: 760,
            height: 500,
            content: renderMarkdownStudio()
          });
          initMarkdownEvents();
          break;

        case 'dos':
          createWindow({
            id: 'dos',
            title: 'DOS Shell v8.0',
            icon: '📟',
            width: 680,
            height: 440,
            content: renderDOSEmulator()
          });
          initDOSTerminal();
          break;

        case 'notes':
          createWindow({
            id: 'notes',
            title: 'CyberSticky Notes',
            icon: '📌',
            width: 520,
            height: 420,
            content: renderNotesApp()
          });
          initNotesEvents();
          break;

        case 'sysinfo':
          createWindow({
            id: 'sysinfo',
            title: 'Telemetry & Stats',
            icon: '⚙️',
            width: 540,
            height: 380,
            content: renderSysInfo()
          });
          initSysInfoEvents();
          break;
      }
    }

    /* --- App 1: File Manager --- */
    function renderFileManager() {
      return `
        <div class="h-full flex flex-col gap-3 font-mono">
          <div class="flex items-center justify-between border-b border-white/10 pb-2">
            <div class="flex items-center gap-2">
              <button id="fm-new-btn" class="px-2.5 py-1 text-xs rounded bg-neonCyan/20 text-neonCyan border border-neonCyan/40 hover:bg-neonCyan hover:text-black transition">+ Create File</button>
              <label class="px-2.5 py-1 text-xs rounded bg-white/5 text-slate-300 border border-white/20 hover:bg-white/10 cursor-pointer">
                ↑ Upload Disk File <input type="file" id="fm-file-input" class="hidden" />
              </label>
            </div>
            <span class="text-[11px] text-slate-400">RAM Session Vault</span>
          </div>

          <div id="fm-dropzone" class="border border-dashed border-cyan-500/40 rounded-lg p-3 text-center text-xs text-slate-400 hover:border-neonCyan transition">
            Drag and drop local text/markdown files here to mount into virtual memory
          </div>

          <div id="fm-list" class="flex-1 overflow-auto grid grid-cols-2 sm:grid-cols-3 gap-2 p-1"></div>
        </div>
      `;
    }

    function initFileManagerEvents() {
      function refreshList() {
        const list = document.getElementById('fm-list');
        if (!list) return;
        list.innerHTML = '';
        Object.keys(OS.files).forEach(filename => {
          const item = document.createElement('div');
          item.className = 'p-2 rounded bg-white/5 border border-white/10 hover:border-neonCyan/60 flex flex-col justify-between group text-xs cursor-pointer';
          item.innerHTML = `
            <div class="flex items-start justify-between">
              <span class="text-neonCyan text-base">📄</span>
              <button class="text-rose-400 hover:text-rose-300 opacity-0 group-hover:opacity-100 transition p-1" onclick="event.stopPropagation(); removeFile('${filename}')">✕</button>
            </div>
            <div class="truncate font-semibold mt-2 text-slate-200" title="${filename}">${filename}</div>
            <div class="text-[10px] text-slate-500 mt-1">${OS.files[filename].length} bytes</div>
          `;
          item.onclick = () => {
            launchApp('markdown');
            setTimeout(() => {
              const editor = document.getElementById('md-input');
              if (editor) {
                editor.value = OS.files[filename];
                editor.dispatchEvent(new Event('input'));
              }
            }, 100);
          };
          list.appendChild(item);
        });
      }

      window.removeFile = async function(name) {
        delete OS.files[name];
        OS.saveFiles();
        refreshList();
        await OS.alert('[SECTOR REMOVED]', `File "${name}" successfully deleted from memory.`);
      };

      const newBtn = document.getElementById('fm-new-btn');
      if (newBtn) {
        newBtn.onclick = async () => {
          const filename = await OS.prompt('[CREATE FILE]', 'Enter filename with extension (.md, .txt, .bat):', 'memo.md');
          if (filename) {
            OS.files[filename] = `# ${filename}\nCreated on ${new Date().toLocaleDateString()}`;
            OS.saveFiles();
            refreshList();
          }
        };
      }

      const dropzone = document.getElementById('fm-dropzone');
      const fileInput = document.getElementById('fm-file-input');

      function handleFile(file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          OS.files[file.name] = e.target.result;
          OS.saveFiles();
          refreshList();
          OS.alert('[STORAGE MOUNTED]', `Successfully mounted "${file.name}" (${file.size} bytes).`);
        };
        reader.readAsText(file);
      }

      if (fileInput) {
        fileInput.onchange = (e) => { if (e.target.files[0]) handleFile(e.target.files[0]); };
      }

      if (dropzone) {
        dropzone.ondragover = (e) => { e.preventDefault(); dropzone.classList.add('border-neonCyan'); };
        dropzone.ondragleave = () => dropzone.classList.remove('border-neonCyan');
        dropzone.ondrop = (e) => {
          e.preventDefault();
          dropzone.classList.remove('border-neonCyan');
          if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
        };
      }

      refreshList();
    }

    /* --- App 2: Markdown Studio (Live Preview Fixed) --- */
    function renderMarkdownStudio() {
      return `
        <div class="h-full flex flex-col gap-2 font-mono">
          <div class="flex items-center justify-between pb-2 border-b border-white/10 text-xs">
            <div class="flex gap-2">
              <button id="md-save-btn" class="px-3 py-1 rounded bg-neonPink/20 text-neonPink border border-neonPink/40 hover:bg-neonPink hover:text-white transition">💾 Save To Memory</button>
            </div>
            <span class="text-neonCyan text-[11px]">Real-Time HTML Render Engine</span>
          </div>
          <div class="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 min-h-0">
            <textarea id="md-input" class="w-full h-full p-3 bg-black/50 border border-white/10 rounded-lg text-slate-100 font-mono text-xs focus:outline-none focus:border-neonPink resize-none leading-relaxed" placeholder="Type Markdown here..."></textarea>
            <div id="md-preview" class="h-full p-4 bg-black/40 border border-neonCyan/20 rounded-lg overflow-y-auto md-render text-xs select-text"></div>

    function initMarkdownEvents() {
      const input = document.getElementById('md-input');
      const preview = document.getElementById('md-preview');
      const saveBtn = document.getElementById('md-save-btn');
      if (!input || !preview) return;

      input.value = OS.files['cyber_manifesto.md'] || '# Cyber Document\nStart typing markdown...';

      function render() {
        const raw = input.value;
        if (typeof marked !== 'undefined') {
          preview.innerHTML = marked.parse(raw);
        } else {
          preview.innerHTML = `<pre class="text-rose-400">Parser library loading...</pre>`;
        }
      }

      input.addEventListener('input', render);
      render();

      if (saveBtn) {
        saveBtn.onclick = async () => {
          const filename = await OS.prompt('[COMMIT CHANGES]', 'Save buffer to virtual file name:', 'cyber_manifesto.md');
          if (filename) {
            OS.files[filename] = input.value;
            OS.saveFiles();
            await OS.alert('[BUFFER WRITTEN]', `Sector written successfully to "${filename}".`);

    /* --- App 3: DOS Emulator --- */
    function renderDOSEmulator() {
      return `
        <div class="h-full flex flex-col bg-black text-emerald-400 font-mono text-xs p-3 rounded border border-emerald-500/40">
          <div id="dos-output" class="flex-1 overflow-y-auto space-y-1 select-text">
            <div>FutureTBM DOS Real-Mode Subsystem [Version 8.02]</div>
            <div>(C) 1981-2026 FutureTBM Labs. All rights reserved.</div>
            <div class="text-slate-400">Type <span class="text-emerald-300 font-bold">HELP</span> for command matrix or <span class="text-emerald-300 font-bold">GAME</span> for Cyber-Snake.</div>
            <div class="my-2 border-b border-emerald-800"></div>
          </div>
          <div class="flex items-center gap-1.5 mt-2 pt-1 border-t border-emerald-900">
            <span class="text-emerald-400 font-bold">C:\\&gt;</span>
            <input type="text" id="dos-input" class="flex-1 bg-transparent text-emerald-400 focus:outline-none font-mono text-xs" autocomplete="off" autofocus />
          </div>
        </div>
      `;
    }

    function initDOSTerminal() {
      const input = document.getElementById('dos-input');
      const output = document.getElementById('dos-output');
      if (!input || !output) return;

      input.focus();
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const cmd = input.value.trim();
          input.value = '';
          output.innerHTML += `<div><span class="text-emerald-500 font-bold">C:\\&gt;</span> ${cmd}</div>`;
          handleDOSCommand(cmd, output);
          output.scrollTop = output.scrollHeight;
        }
      });
    }

    function handleDOSCommand(cmdLine, out) {
      const parts = cmdLine.trim().split(' ');
      const command = parts[0].toUpperCase();
      const arg = parts.slice(1).join(' ');

      switch (command) {
        case 'HELP':
          out.innerHTML += `
            <div class="text-slate-300">Supported Commands:</div>
            <div>  <span class="text-emerald-300">DIR</span>      - List virtual files</div>
            <div>  <span class="text-emerald-300">VER</span>      - Current DOS kernel build</div>
            <div>  <span class="text-emerald-300">TYPE</span>     - Read file (e.g. TYPE readme.txt)</div>
            <div>  <span class="text-emerald-300">CLS</span>      - Clear terminal screen</div>
            <div>  <span class="text-emerald-300">TIME</span>     - Print 12-hour hardware timestamp</div>
            <div>  <span class="text-emerald-300">MEM</span>      - Query free memory</div>
            <div>  <span class="text-emerald-300">GAME</span>     - Launch 16-bit cyber runner game</div>
          `;
          break;

        case 'DIR':
          let fileList = Object.keys(OS.files).map(name => `<div>${name.padEnd(22, ' ')} ${String(OS.files[name].length).padStart(6, ' ')} bytes</div>`).join('');
          out.innerHTML += `
            <div class="text-slate-400"> Directory of C:\\</div>
            ${fileList}
            <div class="mt-1 text-slate-400">${Object.keys(OS.files).length} File(s) active</div>
          `;
          break;

        case 'VER':
          out.innerHTML += `<div>FutureTBM DOS Kernel Version 8.02-X64</div>`;
          break;

        case 'MEM':
          out.innerHTML += `
            <div>655,360 bytes conventional memory</div>
            <div>614,400 bytes available to programs</div>
            <div>1,048,576 bytes continuous extended memory</div>
          `;
          break;

        case 'TIME':
          out.innerHTML += `<div>System Chronometer: ${get12HourTime()}</div>`;
          break;

        case 'TYPE':
          if (!arg) {
            out.innerHTML += `<div class="text-rose-400">Syntax error: TYPE [filename]</div>`;
          } else if (OS.files[arg]) {
            out.innerHTML += `<pre class="text-slate-300 whitespace-pre-wrap">${OS.files[arg]}</pre>`;
          } else {
            out.innerHTML += `<div class="text-rose-400">File not found: ${arg}</div>`;
          }
          break;

        case 'CLS':
          out.innerHTML = '';
          break;

        case 'GAME':
          out.innerHTML += `<div class="text-yellow-300">Spawning Cyber-Snake...</div>`;
          runMiniGame(out);
          break;

        case '':
          break;

        default:
          out.innerHTML += `<div class="text-rose-400">Bad command or file name: '${command}'. Type HELP for options.</div>`;
      }
    }

    function runMiniGame(container) {
      const canvasId = `game-canvas-${Date.now()}`;
      container.innerHTML += `
        <div class="p-2 border border-emerald-500 rounded my-2 inline-block bg-black">
          <div class="text-xs text-yellow-400 mb-1">CYBER-SNAKE (Use Arrow Keys)</div>
          <canvas id="${canvasId}" width="240" height="160" class="bg-slate-950 border border-emerald-900"></canvas>
        </div>
      `;

      setTimeout(() => {
        const canvas = document.getElementById(canvasId);
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 10};
        let dx = 1, dy = 0;

        function draw() {
          ctx.fillStyle = '#050711';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = '#ff007f';
          ctx.fillRect(food.x * 10, food.y * 10, 8, 8);
          ctx.fillStyle = '#00f3ff';
          snake.forEach(part => ctx.fillRect(part.x * 10, part.y * 10, 8, 8));

          const head = {x: snake[0].x + dx, y: snake[0].y + dy};
          if (head.x < 0) head.x = 23;
          if (head.x >= 24) head.x = 0;
          if (head.y < 0) head.y = 15;
          if (head.y >= 16) head.y = 0;

          snake.unshift(head);
          if (head.x === food.x && head.y === food.y) {
            food = { x: Math.floor(Math.random() * 24), y: Math.floor(Math.random() * 16) };
          } else {
            snake.pop();
          }
        }

        setInterval(draw, 120);
        window.addEventListener('keydown', (e) => {
          if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
          if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
          if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
          if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
          if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
        });
      }, 50);
    }

    /* --- App 4: Notes App --- */
    function renderNotesApp() {
      return `
        <div class="h-full flex flex-col gap-3 font-mono">
          <div class="flex items-center justify-between pb-2 border-b border-white/10">
            <button id="add-note-btn" class="px-2.5 py-1 text-xs rounded bg-amber-400/20 text-amber-300 border border-amber-400/40 hover:bg-amber-400 hover:text-black transition">+ New Sticky Note</button>
            <span class="text-[11px] text-slate-400">LocalStorage Storage</span>
          </div>
          <div id="notes-grid" class="flex-1 overflow-auto grid grid-cols-2 gap-3 p-1"></div>
        </div>
      `;
    }

    function initNotesEvents() {
      function refreshNotes() {
        const grid = document.getElementById('notes-grid');
        if (!grid) return;
        grid.innerHTML = '';
        OS.notes.forEach((note, index) => {
          const noteEl = document.createElement('div');
          noteEl.className = 'p-3 rounded-lg bg-gradient-to-br from-amber-500/10 to-purple-600/10 border border-amber-400/30 flex flex-col justify-between group shadow-lg';
          noteEl.innerHTML = `
            <textarea class="bg-transparent text-xs text-amber-200 resize-none focus:outline-none w-full h-24 font-mono leading-relaxed">${note.text}</textarea>
            <div class="flex justify-between items-center text-[10px] text-slate-500 mt-2">
              <span>NOTE #${index + 1}</span>
              <button onclick="removeNote(${note.id})" class="text-rose-400 hover:underline">Purge</button>
            </div>
          `;
          noteEl.querySelector('textarea').oninput = (e) => {
            note.text = e.target.value;
            OS.saveNotes();
          };
          grid.appendChild(noteEl);
        });
      }

      window.removeNote = async function(id) {
        OS.notes = OS.notes.filter(n => n.id !== id);
        OS.saveNotes();
        refreshNotes();
        await OS.alert('[NOTE REMOVED]', 'Holographic note purged.');
      };

      const addBtn = document.getElementById('add-note-btn');
      if (addBtn) {
        addBtn.onclick = () => {
          OS.notes.push({ id: Date.now(), text: 'New holographic memo...' });
          OS.saveNotes();
          refreshNotes();
        };
      }

      refreshNotes();
    }

          <div class="p-2 border border-neonCyan/30 rounded text-center text-slate-400 text-[10px] bg-cyan-950/20">
            SECURITY PROTOCOL: ENCRYPTED // NO ADVERSARIAL THREATS DETECTED
          </div>
        </div>
      `;
    }

    function initSysInfoEvents() {
      const cpuVal = document.getElementById('gauge-cpu-val');
      const cpuBar = document.getElementById('gauge-cpu-bar');
      const memVal = document.getElementById('gauge-mem-val');
      const memBar = document.getElementById('gauge-mem-bar');

      const interval = setInterval(() => {
        if (!cpuVal || !document.contains(cpuVal)) {
          clearInterval(interval);
          return;
        }
        const cpu = Math.floor(20 + Math.random() * 35);
        const mem = performance.memory 
          ? Math.round((performance.memory.usedJSHeapSize / performance.memory.totalJSHeapSize) * 100) 
          : Math.floor(40 + Math.random() * 20);

        cpuVal.innerText = `${cpu}%`;
        cpuBar.style.width = `${cpu}%`;
        memVal.innerText = `${mem}%`;
        memBar.style.width = `${mem}%`;
      }, 1500);
    }

    /* ==========================================================
       4. 12-HOUR CHRONOMETER & INITIALIZATION
       ========================================================== */
    function get12HourTime() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      return `${String(hours).padStart(2, '0')}:${minutes}:${seconds} ${ampm}`;
    }

    function startClock() {
      const clock = document.getElementById('clock');
      const stardate = document.getElementById('stardate');
      const memStat = document.getElementById('mem-stat');

      function update() {
        clock.innerText = get12HourTime();
        
        const now = new Date();
        const start = new Date(now.getFullYear(), 0, 0);
        const diff = now - start;
        const oneDay = 1000 * 60 * 60 * 24;
        const dayOfYear = Math.floor(diff / oneDay);
        stardate.innerText = `STARDATE ${now.getFullYear()}.${dayOfYear}`;

        if (performance.memory && memStat) {
          const usedMB = Math.round(performance.memory.usedJSHeapSize / (1024 * 1024));
          memStat.innerText = `RAM: ${usedMB}MB`;
        }
      }

      setInterval(update, 1000);
      update();
    }

    window.addEventListener('DOMContentLoaded', () => {
      startClock();
      setTimeout(() => launchApp('markdown'), 300);
    });
  </script>
